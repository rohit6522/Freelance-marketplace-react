<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="gc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1c30" />
      <stop offset="100%" stop-color="#070e18" />
    </linearGradient>
    <linearGradient id="gc-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="gc-g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="gc-g2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="gc-spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="gc-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Brutalist Outer Card / Emblem -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="url(#gc-bg)" stroke="url(#gc-border)" stroke-width="14" />

  <!-- Subtle Blueprint Tech Grid lines -->
  <path d="M24 160h464 M24 352h464 M160 24v464 M352 24v464" stroke="#132338" stroke-width="2" stroke-dasharray="6,6" opacity="0.6" />

  <!-- The Geometric "G" Craft Emblem -->
  <path d="M372 176H224c-53.02 0-96 42.98-96 96v40c0 53.02 42.98 96 96 96h128c53.02 0 96-42.98 96-96v-56H280" 
        fill="none" 
        stroke="url(#gc-g1)" 
        stroke-width="48" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Inner Craft Spur / Core Milestone Bar -->
  <path d="M280 256h168" 
        stroke="url(#gc-g2)" 
        stroke-width="36" 
        stroke-linecap="round" />

  <!-- Diamond Craft Nodes (Verified Trust & Milestone Escrow) -->
  <polygon points="372,176 388,160 404,176 388,192" fill="url(#gc-spark)" filter="url(#gc-glow)" />
  <polygon points="280,256 296,240 312,256 296,272" fill="#ffffff" filter="url(#gc-glow)" />
</svg>
